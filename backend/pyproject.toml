[project]
name = "ai-chess-arena"
version = "0.1.0"
description = "Two LLMs play chess against each other; Stockfish and a judge agent score them."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14",
  "chess>=1.11",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.50",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "rich>=13.9",
  "sqlalchemy[asyncio]>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
arena = "app.cli:app"

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
indent-width = 4

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = ["B008"]  # typer.Option(...) defaults are the standard Typer pattern
