# Models visitors can pick on the site. GET /models shows only these (in this order) and
# POST /games refuses any other model. Set PUBLIC_MODELS_FILE= (empty) to allow every
# OpenRouter model, e.g. for local experiments.
#
# Chosen 2026-11-22: fast paid models only (no free models: rate limits and slow replies).
# A speed test picked the 10 fastest of 15, then a benchmark (`uv run arena benchmark`: 45 games,
# 10 moves per side, low effort, 30 s per reply) ranked them. All of them except the judge
# model (JUDGE_MODEL, anthropic/claude-haiku-5.5) are here: a judge shouldn't grade its own games.
# Notes: benchmark W-D-L, seconds per reply, cost of a 10-move game (a full game is ~5x).

# Reasoning effort for games on the site, unless a request asks for another one. The benchmark
# ran at "low": higher effort plays a bit better but replies slower and can lose on time.
reasoning_effort = "low"

models = [
  "google/gemini-3.1-flash-lite",  # 8-1-0, 1.8 s, $0.004
  "openai/gpt-6-luna",  # 5-2-2, 3.4 s, $0.002
  "openai/gpt-oss-120b",  # 5-1-3, 2.0 s, $0.001
  "z-ai/glm-5.3-flash",  # 3-5-1, 1.5 s, $0.0008
  "x-ai/grok-4.3",  # 4-2-3, 8.1 s, $0.02
  "google/gemini-2.5-flash",  # 3-2-4, 5.9 s, $0.03, 15% illegal tries
  "google/gemini-2.5-flash-lite",  # 2-0-7, 5.1 s, $0.006, 1 forfeit
  "mistralai/mistral-small-3.2-24b-instruct",  # 1-1-7, 3.6 s, $0.0005
  "mistralai/mistral-small-2603",  # 0-0-9, 3.6 s, $0.004
]
