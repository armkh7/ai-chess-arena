# Models visitors can pick on the site. GET /models shows only these (in this order) and
# POST /games refuses any other model. Set PUBLIC_MODELS_FILE= (empty) to allow every
# OpenRouter model, e.g. for local experiments.
#
# Chosen by the 2026-11-22 benchmark (`uv run arena benchmark`: 45 games, 15 moves per side,
# low effort, 30 s per reply). Each of these finished all or almost all of its 9 games; models
# that kept losing on time or hitting API errors were left out.

# Reasoning effort for games on the site, unless a request asks for another one. The benchmark
# ran at "low": higher effort plays a bit better but replies slower and can lose on time.
reasoning_effort = "low"

models = [
  "baidu/ernie-5.5-flash-preview:free",  # free; 8-0, 15 s per reply. A preview: may disappear
  "openai/gpt-oss-120b",  # 5-2, 2.4 s per reply, ~$0.0016 per game
  "openai/gpt-5-nano",  # 4-3, 11 s per reply, no illegal moves, ~$0.005 per game
  "mistralai/mistral-small-3.2-24b-instruct",  # 4-3, 2.3 s per reply, ~$0.0007 per game
  "qwen/qwen3.7-flash",  # 3-1-3, 19 s per reply, 1 loss on time, ~$0.002 per game
]
