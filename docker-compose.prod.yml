# Production: the whole arena on one small server, behind the server's own reverse proxy.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Nothing here is reachable from the internet directly: the website and the API listen on
# 127.0.0.1 only, and the server's nginx sends visitors to them (deploy/nginx.conf). The
# database has no published port at all. Settings come from `.env` next to this file.

name: chess-arena

x-logging: &logging  # keep Docker's logs from filling the disk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-arena}
    # A small database on a 2 GB server shared with another site.
    command: postgres -c shared_buffers=64MB -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arena}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arena}
      # One CPU thread and a small hash table for Stockfish: enough for post-game analysis.
      ANALYSIS_THREADS: "1"
      ANALYSIS_HASH_MB: "64"
    # Behind nginx: take the visitor's address from X-Forwarded-For, so the per-visitor limit
    # sees real visitors instead of nginx. Trusting any sender is safe only because this port
    # is bound to 127.0.0.1 below, and nginx overwrites the header (deploy/nginx.conf).
    command: >-
      sh -c "uv run --no-dev alembic upgrade head &&
      uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - ./backend/logs:/app/logs  # the owner's cost log survives rebuilds
    ports:
      - "127.0.0.1:${ARENA_API_PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 640m
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    ports:
      - "127.0.0.1:${ARENA_WEB_PORT:-3100}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

volumes:
  pgdata:
