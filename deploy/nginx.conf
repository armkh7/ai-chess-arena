# The arena on its own (sub)domain, behind the server's nginx (other sites stay as they are).
# ARENA_DOMAIN is a placeholder: the install command below fills in the real name.
#
#   DOMAIN=your.domain.here
#   sed "s/ARENA_DOMAIN/$DOMAIN/" deploy/nginx.conf | sudo tee /etc/nginx/sites-available/ai-chess-arena
#   sudo ln -s /etc/nginx/sites-available/ai-chess-arena /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d "$DOMAIN"   # adds HTTPS to this block
#
# The ports match ARENA_WEB_PORT / ARENA_API_PORT in docker-compose.prod.yml.

server {
    listen 80;
    listen [::]:80;
    server_name ARENA_DOMAIN;

    # The API: /api/games -> http://127.0.0.1:8100/games (the trailing slashes drop "/api").
    location /api/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The visitor's real address, for the per-visitor game limit. Set, not appended:
        # a visitor can't fake it by sending their own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Live games are Server-Sent Events: pass each event on at once (no buffering) and
        # keep the connection open while a game plays (the API pings every 15 s when idle).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The website.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
